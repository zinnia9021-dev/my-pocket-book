<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="https://img.icons8.com/fluency/240/potted-plant.png">
    <title>心语账本 v2.0</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background: #f8f9fa; min-height: 100vh; padding-bottom: 50px; }
        .glass-card { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 1.5rem; }
    </style>
</head>
<body class="p-4">
    <div id="app" class="max-w-md mx-auto">
        <!-- 预算管理头部 -->
        <header class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">财务看板</h1>
            <div class="grid grid-cols-2 gap-3">
                <div class="glass-card p-4">
                    <p class="text-[10px] text-gray-400 font-bold uppercase">月剩余预算</p>
                    <p class="text-xl font-bold text-green-600">¥{{ monthlyRemaining }}</p>
                </div>
                <div class="glass-card p-4">
                    <p class="text-[10px] text-gray-400 font-bold uppercase">本周累计支出</p>
                    <p class="text-xl font-bold text-gray-800">¥{{ weeklyTotal }}</p>
                </div>
            </div>
        </header>

        <!-- 筛选器 -->
        <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
            <button @click="filterType = 'all'" :class="filterType === 'all' ? 'bg-gray-800 text-white' : 'bg-white text-gray-500'" class="px-4 py-2 rounded-full text-xs font-bold transition">全部记录</button>
            <button @click="filterType = 'week'" :class="filterType === 'week' ? 'bg-gray-800 text-white' : 'bg-white text-gray-500'" class="px-4 py-2 rounded-full text-xs font-bold transition">本周明细</button>
            <button @click="showAnalysis = !showAnalysis" class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-xs font-bold">周度AI分析</button>
        </div>

        <!-- AI 周度汇总分析 (点击展示) -->
        <div v-if="showAnalysis" class="glass-card p-5 mb-6 bg-indigo-50/50 border-indigo-100 animate-fade-in">
            <h3 class="text-sm font-bold text-indigo-900 mb-2">✨ 本周财务复盘</h3>
            <p class="text-xs text-indigo-700 leading-relaxed">{{ weeklyAiReport }}</p>
        </div>

        <!-- 记账输入区 -->
        <section class="glass-card p-6 mb-8 shadow-sm">
            <div class="space-y-4">
                <div class="flex gap-2">
                    <select v-model="newItem.category" class="w-1/3 bg-gray-50 p-3 rounded-xl text-sm outline-none">
                        <option>买菜/食材</option><option>餐饮外卖</option><option>日用杂项</option><option>交通出行</option>
                    </select>
                    <input type="number" v-model="newItem.amount" placeholder="金额" class="w-2/3 bg-gray-50 p-3 rounded-xl text-sm font-bold outline-none">
                </div>
                <!-- 详细备注区 -->
                <textarea v-model="newItem.note" rows="2" placeholder="详细买了什么内容？(如：西红柿2斤、排骨...)" class="w-full bg-gray-50 p-3 rounded-xl text-sm outline-none resize-none"></textarea>
                
                <button @click="addRecord" class="w-full bg-gray-800 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">
                    确认记账
                </button>
            </div>
        </section>

        <!-- 历史列表 -->
        <div class="space-y-4">
            <h2 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest pl-2">{{ filterType === 'week' ? '本周记录' : '历史明细' }}</h2>
            <div v-for="(item, index) in filteredRecords" :key="item.id" class="glass-card p-5">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-500">{{ item.category }}</span>
                            <span class="text-[10px] text-gray-400">{{ item.date }}</span>
                        </div>
                        <p class="text-sm font-medium text-gray-700 mt-2 whitespace-pre-line">{{ item.note || '无备注内容' }}</p>
                    </div>
                    <div class="text-right ml-4">
                        <p class="text-lg font-bold text-gray-800">-¥{{ item.amount }}</p>
                        <button @click="deleteItem(index)" class="text-[10px] text-red-300 mt-2 hover:text-red-500">删除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, watch } = Vue;

        createApp({
            setup() {
                const monthlyBudget = 3000; // 设定你的月度预算
                const records = ref(JSON.parse(localStorage.getItem('my_ledger_v2') || '[]'));
                const filterType = ref('all'); // all or week
                const showAnalysis = ref(false);
                const newItem = ref({ category: '买菜/食材', amount: null, note: '', date: new Date().toLocaleDateString() });

                // 自动保存
                watch(records, (val) => localStorage.setItem('my_ledger_v2', JSON.stringify(val)), { deep: true });

                // 计算逻辑
                const monthlyTotal = computed(() => records.value.reduce((s, i) => s + Number(i.amount), 0));
                const monthlyRemaining = computed(() => (monthlyBudget - monthlyTotal.value).toFixed(2));

                const weeklyRecords = computed(() => {
                    const now = new Date();
                    const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return records.value.filter(r => new Date(r.date) >= oneWeekAgo);
                });

                const weeklyTotal = computed(() => weeklyRecords.value.reduce((s, i) => s + Number(i.amount), 0));

                const filteredRecords = computed(() => {
                    return filterType.value === 'week' ? weeklyRecords.value : records.value;
                });

                // 周度AI财务分析逻辑
                const weeklyAiReport = computed(() => {
                    if (weeklyRecords.value.length === 0) return "本周还没有记账数据，AI 暂时无法进行分析。开始记录你的第一笔支出吧！";
                    const topCategory = [...weeklyRecords.value].sort((a,b) => b.amount - a.amount)[0].category;
                    return `本周你一共支出了 ¥${weeklyTotal.value}。主要开销在 [${topCategory}]，占用了本周较多预算。目前月预算剩余 ¥${monthlyRemaining.value}，${monthlyRemaining.value < 500 ? '预算已亮起红灯，建议缩减非必要支出。' : '财务状态健康，请继续保持。'}`;
                });

                const addRecord = () => {
                    if (!newItem.value.amount) return;
                    records.value.unshift({ id: Date.now(), ...newItem.value, date: new Date().toLocaleDateString() });
                    newItem.value = { category: '买菜/食材', amount: null, note: '', date: new Date().toLocaleDateString() };
                };

                const deleteItem = (idx) => { if(confirm("确定删除吗？")) records.value.splice(idx, 1); };

                return { records, newItem, monthlyRemaining, weeklyTotal, filterType, filteredRecords, showAnalysis, weeklyAiReport, addRecord, deleteItem };
            }
        }).mount('#app');
    </script>
</body>
</html>
